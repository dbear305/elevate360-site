name: NetTruth verification gate
on:
  pull_request:
    paths:
      - 'src/**/nettruth/**'
      - 'services/nettruth-node/**'
      - 'tests/nettruth-*.test.mjs'
      - 'next.config.ts'
      - 'package*.json'
      - '.github/workflows/nettruth-verification-check.yml'
permissions:
  contents: read
concurrency:
  group: nettruth-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:nettruth
      - run: npm run check
      - run: bash -n services/nettruth-node/install.sh
